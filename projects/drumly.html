<!-- DRUMBOX — Retro Drum Machine -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRUMBOX — Retro Drum Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5EDD6;
    --tan: #E8D5A3;
    --brown: #5C3D1E;
    --dark: #1A0F05;
    --orange: #D4521A;
    --amber: #C8860A;
    --red: #B91C1C;
    --green: #1A6B2A;
    --lcd: #8BAE5A;
    --lcd-dark: #2D3D0F;
    --metal: #9E8E7A;
    --shadow: rgba(0,0,0,0.6);
  }

  body {
    background-color: #0D0705;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 16px 40px;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cream);
    overflow-x: hidden;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 90px);
    letter-spacing: 12px;
    color: var(--orange);
    text-shadow: 4px 4px 0 #5C1A00, 8px 8px 0 #2A0D00;
    line-height: 1;
  }

  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 6px;
    color: var(--metal);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .tape-stripe {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--orange) 0px, var(--orange) 20px, var(--amber) 20px, var(--amber) 40px, var(--brown) 40px, var(--brown) 60px);
    width: min(700px, 100%);
    margin: 10px auto;
    border-radius: 3px;
  }

  .machine {
    background: linear-gradient(160deg, #3D2810 0%, #2A1B0A 50%, #1F1408 100%);
    border: 3px solid #6B4A22;
    border-radius: 16px;
    padding: 28px 24px;
    width: min(720px, 100%);
    box-shadow:
      0 0 0 1px #B8813A,
      0 20px 60px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 8px rgba(0,0,0,0.4);
    position: relative;
  }

  .machine::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 13px;
    border: 1px solid rgba(184,129,58,0.3);
    pointer-events: none;
  }

  .panel-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--metal);
    text-align: center;
    margin-bottom: 16px;
    opacity: 0.7;
  }

  .lcd-display {
    background: var(--lcd-dark);
    border: 2px solid #1A2800;
    border-radius: 6px;
    padding: 10px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 12px rgba(139,174,90,0.15);
  }

  .lcd-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--lcd);
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(139,174,90,0.6);
  }

  .lcd-note {
    font-size: 11px;
    opacity: 0.7;
  }

  .drums-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }

  @media (max-width: 480px) {
    .drums-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  .drum-pad {
    position: relative;
    border-radius: 10px;
    padding: 18px 12px 14px;
    cursor: pointer;
    user-select: none;
    border: 2px solid transparent;
    transition: transform 0.06s, box-shadow 0.06s, background 0.06s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    text-align: center;
    background: linear-gradient(160deg, #4A300E 0%, #2E1D08 100%);
    border-color: #6B4A22;
    box-shadow: 0 4px 0 #1A0F05, 0 6px 16px rgba(0,0,0,0.5);
  }

  .drum-pad:active,
  .drum-pad.active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #1A0F05, 0 2px 8px rgba(0,0,0,0.5);
  }

  .drum-pad.active {
    background: linear-gradient(160deg, var(--pad-color, #8B4513) 0%, #4A2800 100%);
    border-color: var(--pad-color, #D4521A);
    box-shadow: 0 0 0 #1A0F05, 0 0 20px var(--pad-glow, rgba(212,82,26,0.4));
  }

  .drum-pad .key-badge {
    position: absolute;
    top: 8px;
    right: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--metal);
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(158,142,122,0.3);
    border-radius: 4px;
    padding: 1px 6px;
    letter-spacing: 1px;
  }

  .drum-pad.active .key-badge { color: var(--cream); border-color: var(--pad-color, #D4521A); }

  .drum-icon {
    font-size: 30px;
    display: block;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    line-height: 1;
  }

  .drum-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--cream);
    display: block;
  }

  .drum-desc {
    font-size: 9px;
    color: var(--metal);
    letter-spacing: 2px;
    margin-top: 2px;
    display: block;
  }

  .controls-row {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .knob-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .knob-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--metal);
    text-transform: uppercase;
  }

  .knob {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7A5A30, #2A1A08);
    border: 2px solid #6B4A22;
    position: relative;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .knob::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: var(--cream);
    border-radius: 2px;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(var(--angle, 0deg));
  }

  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 6px;
    background: #1A0F05;
    border-radius: 3px;
    border: 1px solid #4A3010;
    outline: none;
    cursor: pointer;
  }

  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--tan), var(--brown));
    border: 2px solid var(--amber);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .retro-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--cream);
    background: linear-gradient(160deg, #4A300E, #2E1D08);
    border: 2px solid #6B4A22;
    border-radius: 6px;
    padding: 8px 20px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1A0F05;
    transition: transform 0.06s, box-shadow 0.06s;
    -webkit-tap-highlight-color: transparent;
  }

  .retro-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #1A0F05; }
  .retro-btn.danger { border-color: #8B1A1A; color: #F87171; }
  .retro-btn.success { border-color: #1A5A2A; color: #86EFAC; }

  .vis-bar-container {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 32px;
    margin: 0 12px;
    padding: 4px 0;
  }

  .vis-bar {
    width: 5px;
    background: var(--lcd);
    border-radius: 2px 2px 0 0;
    height: 4px;
    transition: height 0.08s ease-out;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(139,174,90,0.5);
  }

  .vu-meter {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
  }

  .vu-dots {
    display: flex;
    gap: 4px;
  }

  .vu-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1A0F05;
    border: 1px solid #3A2A10;
    transition: background 0.1s, box-shadow 0.1s;
  }

  .vu-dot.lit-green { background: #22C55E; box-shadow: 0 0 8px #22C55E; }
  .vu-dot.lit-amber { background: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
  .vu-dot.lit-red { background: #EF4444; box-shadow: 0 0 8px #EF4444; }

  .keyboard-hint {
    text-align: center;
    font-size: 10px;
    color: var(--metal);
    letter-spacing: 3px;
    margin-top: 14px;
    opacity: 0.6;
  }

  .rivet {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #B89060, #5C3A18);
    border: 1px solid #8B6030;
    display: inline-block;
  }

  .rivets-row {
    display: flex;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 14px;
  }

  .bpm-display {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: #F87171;
    text-shadow: 0 0 12px rgba(248,113,113,0.5);
    letter-spacing: 4px;
    min-width: 60px;
    text-align: center;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 10px;
    color: #5C3D1E;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .flash-overlay {
    position: fixed;
    inset: 0;
    background: rgba(212,82,26,0.08);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.05s;
    z-index: 999;
  }
  .flash-overlay.show { opacity: 1; }
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>

<header>
  <div class="logo-text">DRUMBOX</div>
  <div class="logo-sub">— ANALOG PERCUSSION UNIT MK·II —</div>
  <div class="tape-stripe"></div>
</header>

<div class="machine">
  <div class="rivets-row">
    <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div>
  </div>

  <div class="lcd-display">
    <div>
      <div class="lcd-text">DRUMBOX MK-II</div>
      <div class="lcd-text lcd-note" id="lcdNote">READY — TAP A PAD</div>
    </div>
    <div class="vu-meter">
      <div class="vu-dots" id="vuMeter">
        <div class="vu-dot"></div>
        <div class="vu-dot"></div>
        <div class="vu-dot"></div>
        <div class="vu-dot"></div>
        <div class="vu-dot"></div>
        <div class="vu-dot"></div>
      </div>
      <div class="lcd-text lcd-note" style="font-size:9px">VU</div>
    </div>
    <div class="vis-bar-container" id="visBars">
      <div class="vis-bar"></div><div class="vis-bar"></div>
      <div class="vis-bar"></div><div class="vis-bar"></div>
      <div class="vis-bar"></div><div class="vis-bar"></div>
      <div class="vis-bar"></div><div class="vis-bar"></div>
    </div>
  </div>

  <div class="panel-label">◈ PERCUSSION PADS ◈</div>

  <div class="drums-grid" id="drumsGrid"></div>

  <div class="controls-row">
        <div class="ctrl-card" style="flex-direction:row; gap:10px; align-items:center;">
      <button class="btn accent-btn" id="recordBtn" onclick="toggleRecording()">
        Record
      </button>

      <button class="btn" id="playRecordingBtn" onclick="playRecording()" disabled>
        Play
      </button>

      <button class="btn" id="downloadBtn" onclick="downloadRecording()" disabled>
        Download
      </button>
    </div>
    <div class="knob-group">
      <div class="knob" id="volKnob" title="Volume" data-min="0" data-max="1" data-value="0.8" style="--angle: 80deg"></div>
      <div class="knob-label">VOLUME</div>
    </div>
    <div class="knob-group">
      <div class="knob" id="reverbKnob" title="Reverb" data-min="0" data-max="1" data-value="0.2" style="--angle: -60deg"></div>
      <div class="knob-label">REVERB</div>
    </div>
    <div class="knob-group" style="flex-direction:row; gap:8px; align-items:center">
      <button class="retro-btn" id="muteBtn" onclick="toggleMute()">MUTE</button>
      <button class="retro-btn success" id="powerBtn" onclick="initAudio()">POWER ON</button>
    </div>
    <div class="knob-group">
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80">
      <div class="knob-label">MASTER VOL</div>
    </div>
  </div>

  <div class="rivets-row" style="margin-top:16px; margin-bottom:0">
    <div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div>
  </div>
</div>

<div class="keyboard-hint">◂ USE KEYBOARD KEYS SHOWN ON EACH PAD ▸</div>

<footer>© 1979 DRUMBOX INDUSTRIES — ANALOG UNIT — ALL SOUNDS SYNTHESIZED</footer>

<script>
  let mediaDest;
  let mediaRecorder;
  let recordedChunks = [];
  let recordedBlob = null;
  let isRecording = false;

const PADS = [
  { name: 'KICK', desc: '808 BASS DRUM', key: 'Q', icon: '🥁',
    color: '#C8410A', glow: 'rgba(200,65,10,0.5)',
    synth: (ac, gain, rev) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(160, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 0.3);
      g.gain.setValueAtTime(gain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
      o.connect(g); g.connect(rev); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.5);
    }
  },
  { name: 'SNARE', desc: 'LIN DRUM CRACK', key: 'W', icon: '💥',
    color: '#B84A08', glow: 'rgba(184,74,8,0.5)',
    synth: (ac, gain, rev) => {
      const buf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 1000;
      const g = ac.createGain();
      g.gain.setValueAtTime(gain * 0.8, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.value = 200;
      og.gain.setValueAtTime(gain * 0.5, ac.currentTime);
      og.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.06);
      src.connect(f); f.connect(g); g.connect(rev); g.connect(ac.destination);
      o.connect(og); og.connect(ac.destination);
      src.start(); src.stop(ac.currentTime + 0.2);
      o.start(); o.stop(ac.currentTime + 0.06);
    }
  },
  { name: 'HI-HAT', desc: 'CLOSED 909', key: 'E', icon: '🎵',
    color: '#A3580A', glow: 'rgba(163,88,10,0.5)',
    synth: (ac, gain, rev) => {
      const buf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 7000;
      const g = ac.createGain();
      g.gain.setValueAtTime(gain * 0.5, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
      src.connect(f); f.connect(g); g.connect(rev); g.connect(ac.destination);
      src.start(); src.stop(ac.currentTime + 0.05);
    }
  },
  { name: 'OPEN HAT', desc: 'OPEN 909', key: 'A', icon: '✨',
    color: '#9B6B0A', glow: 'rgba(155,107,10,0.5)',
    synth: (ac, gain, rev) => {
      const buf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 6000;
      const g = ac.createGain();
      g.gain.setValueAtTime(gain * 0.4, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
      src.connect(f); f.connect(g); g.connect(rev); g.connect(ac.destination);
      src.start(); src.stop(ac.currentTime + 0.3);
    }
  },
  { name: 'TOM HI', desc: 'HIGH TOM', key: 'S', icon: '🔴',
    color: '#8A4A10', glow: 'rgba(138,74,16,0.5)',
    synth: (ac, gain, rev) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(300, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.2);
      g.gain.setValueAtTime(gain * 0.7, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25);
      o.connect(g); g.connect(rev); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.25);
    }
  },
  { name: 'TOM MID', desc: 'MID TOM', key: 'D', icon: '🟠',
    color: '#7A4018', glow: 'rgba(122,64,24,0.5)',
    synth: (ac, gain, rev) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(220, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(90, ac.currentTime + 0.25);
      g.gain.setValueAtTime(gain * 0.75, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
      o.connect(g); g.connect(rev); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.3);
    }
  },
  { name: 'FLOOR TOM', desc: 'FLOOR TOM', key: 'Z', icon: '🟤',
    color: '#6A3818', glow: 'rgba(106,56,24,0.5)',
    synth: (ac, gain, rev) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(55, ac.currentTime + 0.4);
      g.gain.setValueAtTime(gain * 0.8, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.45);
      o.connect(g); g.connect(rev); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.45);
    }
  },
  { name: 'CRASH', desc: 'CRASH CYMBAL', key: 'X', icon: '⚡',
    color: '#5A5020', glow: 'rgba(90,80,32,0.4)',
    synth: (ac, gain, rev) => {
      const ratios = [1, 1.483, 1.932, 2.546, 3.175, 4.23];
      ratios.forEach((r, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square';
        o.frequency.value = 400 * r;
        g.gain.setValueAtTime((gain * 0.3) / (i + 1), ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.2);
        o.connect(g); g.connect(rev); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 1.2);
      });
    }
  },
  { name: 'RIDE', desc: 'RIDE CYMBAL', key: 'C', icon: '🌟',
    color: '#4A5830', glow: 'rgba(74,88,48,0.4)',
    synth: (ac, gain, rev) => {
      const ratios = [1, 1.483, 1.932, 2.546];
      ratios.forEach((r, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square';
        o.frequency.value = 600 * r;
        g.gain.setValueAtTime((gain * 0.2) / (i + 1), ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
        o.connect(g); g.connect(rev); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.6);
      });
    }
  },
];

let audioCtx = null;
let reverbNode = null;
let masterGain = null;
let muted = false;
let volume = 0.8;
let reverbMix = 0.2;
let powered = false;
let vuLevel = 0;
let vuAnimFrame = null;

async function initAudio() {
  if (powered) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = volume;
  masterGain.connect(audioCtx.destination);

  const convLen = audioCtx.sampleRate * 2;
  const convBuf = audioCtx.createBuffer(2, convLen, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = convBuf.getChannelData(ch);
    for (let i = 0; i < convLen; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / convLen, 2);
    }
  }
  reverbNode = audioCtx.createConvolver();
  reverbNode.buffer = convBuf;
  const reverbGain = audioCtx.createGain();
  reverbGain.gain.value = reverbMix;
  reverbNode.connect(reverbGain);
  reverbGain.connect(masterGain);

  powered = true;
  document.getElementById('powerBtn').textContent = 'POWERED';
  document.getElementById('powerBtn').style.borderColor = '#1A6B2A';
  document.getElementById('powerBtn').style.color = '#86EFAC';
  document.getElementById('lcdNote').textContent = 'SYSTEM READY — GO!';
  animateVU();
}

function playDrum(index) {
  if (!powered) {
    initAudio().then(() => playDrum(index));
    return;
  }
  if (muted) return;
  const pad = PADS[index];
  const g = volume * 0.9;
  try { pad.synth(audioCtx, g, reverbNode); } catch(e) {}
  flashPad(index);
  flashScreen();
  updateLCD(pad.name);
  triggerVU();
}

function flashPad(index) {
  const el = document.querySelectorAll('.drum-pad')[index];
  if (!el) return;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 150);
}

function flashScreen() {
  const ov = document.getElementById('flashOverlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 60);
}

function updateLCD(name) {
  document.getElementById('lcdNote').textContent = `▶ ${name} ◀`;
}

function triggerVU() {
  vuLevel = 1;
}

function animateVU() {
  const dots = document.querySelectorAll('.vu-dot');
  const bars = document.querySelectorAll('.vis-bar');
  let barPhase = 0;

  function frame() {
    vuLevel *= 0.88;
    const level = vuLevel;

    dots.forEach((dot, i) => {
      dot.className = 'vu-dot';
      const threshold = i / dots.length;
      if (level > threshold) {
        if (i < 3) dot.classList.add('lit-green');
        else if (i < 5) dot.classList.add('lit-amber');
        else dot.classList.add('lit-red');
      }
    });

    barPhase += 0.15;
    bars.forEach((bar, i) => {
      const noise = Math.max(0, level + Math.sin(barPhase + i * 0.8) * 0.3);
      const h = Math.max(4, Math.round(noise * 28));
      bar.style.height = h + 'px';
    });

    vuAnimFrame = requestAnimationFrame(frame);
  }
  frame();
}

function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.textContent = muted ? 'UNMUTE' : 'MUTE';
  btn.style.borderColor = muted ? '#8B1A1A' : '';
  btn.style.color = muted ? '#F87171' : '';
  document.getElementById('lcdNote').textContent = muted ? 'MUTED ■' : 'UNMUTED ▶';
}

document.getElementById('volSlider').addEventListener('input', function() {
  volume = this.value / 100;
  if (masterGain) masterGain.gain.value = volume;
  const angle = -135 + (volume * 270);
  document.getElementById('volKnob').style.setProperty('--angle', angle + 'deg');
});

function buildPads() {
  const grid = document.getElementById('drumsGrid');
  PADS.forEach((pad, i) => {
    const div = document.createElement('div');
    div.className = 'drum-pad';
    div.style.setProperty('--pad-color', pad.color);
    div.style.setProperty('--pad-glow', pad.glow);
    div.innerHTML = `
      <span class="key-badge">${pad.key}</span>
      <span class="drum-icon">${pad.icon}</span>
      <span class="drum-name">${pad.name}</span>
      <span class="drum-desc">${pad.desc}</span>
    `;
    div.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      playDrum(i);
    });
    grid.appendChild(div);
  });
}

const keyMap = {};
PADS.forEach((p, i) => keyMap[p.key] = i);

document.addEventListener('keydown', (e) => {
  const k = e.key.toUpperCase();
  if (keyMap[k] !== undefined && !e.repeat) {
    playDrum(keyMap[k]);
  }
});

buildPads();
</script>
