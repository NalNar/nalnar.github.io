<!-- A whiteboard app  -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Smooth Whiteboard</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Inter, sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }

  .toolbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    padding: 12px 18px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    box-shadow:
      0 10px 30px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.8);
    z-index: 100;
  }

  .color {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .color:hover {
    transform: scale(1.15);
  }

  .black { background: #111; }
  .red { background: #ff3b30; }
  .blue { background: #007aff; }
  .green { background: #34c759; }
  .yellow { background: #ffcc00; }

  button {
    border: none;
    background: #111;
    color: white;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }

  button:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<div class="toolbar">
  <div class="color black" data-color="#111111"></div>
  <div class="color red" data-color="#ff3b30"></div>
  <div class="color blue" data-color="#007aff"></div>
  <div class="color green" data-color="#34c759"></div>
  <div class="color yellow" data-color="#ffcc00"></div>

  <button id="penBtn">Pen</button>
  <button id="eraserBtn">Eraser</button>
  <button id="clearBtn">Clear</button>
</div>

<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let strokes = [];
let currentStroke = [];

let currentColor = "#111111";
let currentTool = "pen";

// --------------------
// Retina Resize
// --------------------

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);

  redraw();
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

// --------------------
// Toolbar
// --------------------

document.querySelectorAll(".color").forEach(btn => {
  btn.addEventListener("click", () => {
    currentColor = btn.dataset.color;
    currentTool = "pen";
  });
});

document.getElementById("penBtn").addEventListener("click", () => {
  currentTool = "pen";
});

document.getElementById("eraserBtn").addEventListener("click", () => {
  currentTool = "eraser";
});

document.getElementById("clearBtn").addEventListener("click", () => {
  strokes = [];
  redraw();
});

// --------------------
// Pointer Events
// --------------------

canvas.addEventListener("pointerdown", e => {
  drawing = true;

  currentStroke = {
    tool: currentTool,
    color: currentColor,
    points: []
  };

  addPoint(e);

  redraw();
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;

  addPoint(e);

  redraw();
});

window.addEventListener("pointerup", () => {
  if (!drawing) return;

  drawing = false;

  strokes.push(currentStroke);
});

// --------------------
// Add Point
// --------------------

function addPoint(e) {
  const rect = canvas.getBoundingClientRect();

  currentStroke.points.push({
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  });
}

// --------------------
// Draw Stroke
// --------------------

function drawStroke(stroke) {
  const points = stroke.points;

  if (points.length < 2) return;

  ctx.beginPath();

  if (stroke.tool === "eraser") {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineWidth = 30;
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = 4;
  }

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 1; i < points.length - 1; i++) {
    const midX = (points[i].x + points[i + 1].x) / 2;
    const midY = (points[i].y + points[i + 1].y) / 2;

    ctx.quadraticCurveTo(
      points[i].x,
      points[i].y,
      midX,
      midY
    );
  }

  ctx.lineTo(
    points[points.length - 1].x,
    points[points.length - 1].y
  );

  ctx.stroke();

  ctx.globalCompositeOperation = "source-over";
}

// --------------------
// Redraw
// --------------------

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  strokes.forEach(drawStroke);

  if (drawing) {
    drawStroke(currentStroke);
  }
}
</script>
</body>
</html>
