    <main>
        <svg id="hello-svg" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
        <defs>

      <!-- MAIN GRADIENT -->

      <linearGradient
          id="hg"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
      >

          <!-- lavender -->

          <stop
              offset="0%"
              stop-color="#d8d7ee"
          />

          <!-- coral -->

          <stop
              offset="28%"
              stop-color="#ff8e6b"
          />

          <!-- blue -->

          <stop
              offset="62%"
              stop-color="#7ea8ff"
          />

          <!-- yellow -->

          <stop
              offset="100%"
              stop-color="#f2e76b"
          />

      </linearGradient>


      <!-- WORLD -->

      <linearGradient
          id="wg"
          x1="0"
          y1="0"
          x2="1"
          y2="0"
      >

          <stop
              offset="0%"
              stop-color="#d8d7ee"
          />

          <stop
              offset="30%"
              stop-color="#ff8e6b"
          />

          <stop
              offset="65%"
              stop-color="#7ea8ff"
          />

          <stop
              offset="100%"
              stop-color="#f2e76b"
          />

      </linearGradient>


      <!-- GLOW -->

      <filter id="glow">

          <feGaussianBlur
              stdDeviation="4"
              result="b"
          />

          <feMerge>

              <feMergeNode in="b"/>

              <feMergeNode in="SourceGraphic"/>

          </feMerge>

      </filter>

  </defs>
        <g id="hello-group" filter="url(#glow)"></g>
        <g id="wd-group"    filter="url(#glow)" opacity="0"></g>
        <line id="strike-line"
            x1="0" y1="0" x2="0" y2="0"
            stroke="rgba(255,255,255,0.75)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="1000"
            stroke-dashoffset="1000"/>
        </svg>
        
      </main>
      
      <!-- Button under the animation -->
      <button class="home-button"> Hello </button>
