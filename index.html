<style>
  
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow-x: hidden;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Sky canvas — lowest layer ── */
  #sky-canvas {
    position: fixed;
    inset: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    animation: fadeDown 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .nav-pill {
    display: flex;
    gap: 4px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 100px;
    box-shadow: 0 2px 20px rgba(100,150,200,0.12), 0 1px 0 rgba(255,255,255,0.8) inset;
  }

  .nav-pill a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: rgba(40,55,80,0.65);
    padding: 7px 18px;
    border-radius: 100px;
    transition: color 0.2s, background 0.2s;
  }
  .nav-pill a:hover { color: rgba(40,55,80,0.95); background: rgba(255,255,255,0.5); }
  .nav-pill a.active {
    color: rgba(30,45,75,1);
    background: rgba(255,255,255,0.75);
    box-shadow: 0 1px 8px rgba(100,150,220,0.18);
  }

  /* ── Main / Hello SVG ── */
  main {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 80px 24px 160px;
  }
#hello-svg {
  width: min(720px, 92vw);
  height: auto;

  opacity: 0.92;

  filter:
    saturate(0.82)
    brightness(1.02);
}

  /* ── Hello button ── */
  .home-button {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    padding: 14px 40px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(35,50,80,0.85);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.88);
    border-radius: 100px;
    box-shadow:
      0 4px 24px rgba(120,170,230,0.18),
      0 1px 0 rgba(255,255,255,0.9) inset;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    animation: fadeUp 1s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  .home-button:hover {
    background: rgba(255,255,255,0.78);
    box-shadow: 0 8px 36px rgba(100,160,240,0.28), 0 1px 0 rgba(255,255,255,0.9) inset;
    transform: translateX(-50%) translateY(-2px);
  }
  .home-button:active { transform: translateX(-50%) translateY(0); }


  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(14px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>

<nav>
  <div class="nav-pill">
    <a href="index.html" class="active">Home</a>
    <a href="work.html">Work</a>
    <a href="about_me.html">About</a>
  </div>
</nav>

<!-- Hello Animation -->
<main>
  <svg id="hello-svg" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#E3DDF5"/>
          <stop offset="28%"  stop-color="#FFB59D"/>
          <stop offset="62%"  stop-color="#AFCBFF"/>
          <stop offset="100%" stop-color="#F7E8A4"/>
        </linearGradient>

        <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#E3DDF5"/>
          <stop offset="30%"  stop-color="#FFB59D"/>
          <stop offset="65%"  stop-color="#AFCBFF"/>
          <stop offset="100%" stop-color="#F7E8A4"/>
        </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="hello-group" filter="url(#glow)"></g>
    <g id="wd-group"    filter="url(#glow)" opacity="0"></g>
    <line id="strike-line"
      x1="0" y1="0" x2="0" y2="0"
      stroke="rgba(255,255,255,0.75)"
      stroke-width="5" stroke-linecap="round"
      stroke-dasharray="1000" stroke-dashoffset="1000"/>
  </svg>
</main>

<button class="home-button">Hello</button>

<div class="music-credit">

</div>

<audio id="bg-music" loop>

</audio>



<!-- ═══ SKY SCENE SCRIPT ═══ -->
<script>
(function(){
  const canvas = document.getElementById('sky-canvas');
  const ctx    = canvas.getContext('2d');

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function randInt(a,b){ return Math.floor(rand(a,b+1)); }

  /* ── Cloud class ── */
  class Cloud {
    constructor(anywhere){ this.reset(anywhere); }
    reset(anywhere){
      this.w     = rand(140, 360);
      this.h     = this.w * rand(0.25,0.42);
      this.x     = anywhere ? rand(-this.w, canvas.width + this.w) : -this.w - 20;
      // ONLY in the top 38% — never over the centred text
      this.y     = rand(0.02, 0.38) * canvas.height;
      this.speed = rand(0.08, 0.28);
      this.alpha = rand(0.45, 0.80);
      this.puffs = this._puffs();
    }
    _puffs(){
      const n=randInt(4,8), p=[];
      for(let i=0;i<n;i++)
        p.push({ox:rand(0,this.w), oy:rand(this.h*0.3,this.h*0.82), r:rand(this.h*0.32,this.h*0.68)});
      return p;
    }
    draw(){
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.translate(this.x, this.y);
      ctx.shadowColor = 'rgba(180,210,235,0.18)';
      ctx.shadowBlur  = 20;
      const g = ctx.createRadialGradient(this.w/2,this.h/2,this.h*0.08, this.w/2,this.h/2,this.w*0.58);
      g.addColorStop(0,   'rgba(255,255,255,1)');
      g.addColorStop(0.55,'rgba(242,250,255,0.96)');
      g.addColorStop(1,   'rgba(220,238,252,0.28)');
      ctx.fillStyle = g;
      ctx.beginPath();
      for(const p of this.puffs){ ctx.moveTo(p.ox+p.r,p.oy); ctx.arc(p.ox,p.oy,p.r,0,Math.PI*2); }
      ctx.fill();
      ctx.restore();
    }
    update(){
      this.x += this.speed;
      if(this.x > canvas.width + this.w + 20) this.reset(false);
    }
  }

  /* ── Mote class ── */
  class Mote {
    constructor(){ this.reset(true); }
    reset(anywhere){
      this.x     = rand(0, canvas.width);
      this.y     = anywhere ? rand(0,canvas.height) : canvas.height+8;
      this.r     = rand(1.2,4.5);
      this.vy    = -rand(0.06,0.22);
      this.vx    = rand(-0.08,0.08);
      this.alpha = rand(0.08,0.38);
      const pal  = ['255,200,180','200,215,255','255,235,160','185,230,255','238,205,255'];
      this.col   = pal[randInt(0,pal.length-1)];
    }
    draw(){
      const g = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
      g.addColorStop(0,`rgba(${this.col},${this.alpha})`);
      g.addColorStop(1,`rgba(${this.col},0)`);
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }
    update(){
      this.x += this.vx + Math.sin(Date.now()*0.00035+this.y*0.01)*0.06;
      this.y += this.vy;
      if(this.y < -8) this.reset(false);
    }
  }

  /* ── Sun ── */
  function drawSun(){
    const sx=canvas.width*0.80, sy=canvas.height*0.10, sr=canvas.width*0.17;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    g.addColorStop(0,  'rgba(255,250,225,0.65)');
    g.addColorStop(0.28,'rgba(255,238,185,0.30)');
    g.addColorStop(1,  'rgba(255,238,185,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  }

  /* ── Horizon haze ── */
  function drawHaze(){
    const g=ctx.createLinearGradient(0,canvas.height*0.72,0,canvas.height);
    g.addColorStop(0,'rgba(253,246,238,0)');
    g.addColorStop(1,'rgba(253,246,238,0.55)');
    ctx.fillStyle=g; ctx.fillRect(0,canvas.height*0.72,canvas.width,canvas.height*0.28);
  }

  const clouds = Array.from({length:10}, ()=>new Cloud(true));
  const motes  = Array.from({length:48}, ()=>new Mote());

  function frame(){
    const W=canvas.width, H=canvas.height;

    // Sky
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,  '#b8dff0');
    sky.addColorStop(0.4,'#d8eef8');
    sky.addColorStop(0.78,'#edf5fb');
    sky.addColorStop(1,  '#fdf6ee');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

    drawSun();
    drawHaze();

    // Back clouds (top of sky, very soft)
    clouds.slice(0,5).forEach(c=>{c.update();c.draw();});
    // Motes
    motes.forEach(m=>{m.update();m.draw();});
    // Front clouds
    clouds.slice(5).forEach(c=>{c.update();c.draw();});

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
