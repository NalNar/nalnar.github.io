    <main>
        <svg id="hello-svg" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#ff6ec7"/>
            <stop offset="45%"  stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#38bdf8"/>
            </linearGradient>
            <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#34d399"/>
            <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
            <filter id="glow">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>
        <g id="hello-group" filter="url(#glow)"></g>
        <g id="wd-group"    filter="url(#glow)" opacity="0"></g>
        <line id="strike-line"
            x1="0" y1="0" x2="0" y2="0"
            stroke="rgba(255,255,255,0.75)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="1000"
            stroke-dashoffset="1000"/>
        </svg>
        
      </main>
      
      <!-- Button under the animation -->
      <button class="home-button"> Hello </button>
